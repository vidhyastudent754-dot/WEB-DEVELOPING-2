<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Attendance System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏫 School Attendance System</h1>
            <p>Track student attendance and notify parents automatically</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('register')">Register Student</button>
            <button class="tab-btn" onclick="switchTab('attendance')">Mark Attendance</button>
            <button class="tab-btn" onclick="switchTab('students')">View Students</button>
        </div>

        <!-- Register Student Tab -->
        <div id="register-tab" class="tab-content active">
            <div class="card">
                <h2>Register New Student</h2>
                <form id="register-form">
                    <div class="form-group">
                        <label for="student-name">Student Name</label>
                        <input type="text" id="student-name" name="name" required placeholder="Enter student name">
                    </div>
                    <div class="form-group">
                        <label for="roll-number">Roll Number</label>
                        <input type="text" id="roll-number" name="roll_number" required placeholder="Enter roll number">
                    </div>
                    <div class="form-group">
                        <label for="class-name">Class</label>
                        <input type="text" id="class-name" name="class" required placeholder="Enter class (e.g., 10th Grade)">
                    </div>
                    <div class="form-group">
                        <label for="parent-email">Parent Email</label>
                        <input type="email" id="parent-email" name="parent_email" required placeholder="Enter parent's email address">
                    </div>
                    <button type="submit" class="btn btn-primary">Register Student</button>
                </form>
                <div id="register-message" class="message"></div>
            </div>
        </div>

        <!-- Mark Attendance Tab -->
        <div id="attendance-tab" class="tab-content">
            <div class="card">
                <h2>Mark Attendance</h2>
                <p class="date-display" id="current-date"></p>
                <div id="attendance-list">
                    <p class="loading">Loading students...</p>
                </div>
                <button onclick="submitAttendance()" class="btn btn-success">Submit Attendance</button>
                <div id="attendance-message" class="message"></div>
            </div>
        </div>

        <!-- View Students Tab -->
        <div id="students-tab" class="tab-content">
            <div class="card">
                <h2>Registered Students</h2>
                <div id="students-list">
                    <p class="loading">Loading students...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
